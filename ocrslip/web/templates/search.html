{% extends "base.html" %}
{% block content %}
{% if deleted %}
<div class="card" style="background:#e3f5e9; border-color:#9c9">ลบใบ <b>{{ deleted }}</b> ถาวรแล้ว</div>
{% endif %}
<div class="card">
  <h2>ค้นหาใบจอดรถ</h2>
  <p class="muted">พิมพ์ชื่อ เบอร์โทร หรือทะเบียนก็ได้ · สะกดผิดหรือเลขเพี้ยน 1-2 ตัวก็ยังหาเจอ</p>
  <input type="search" name="q" placeholder="เช่น สมชาย / 0800000000 / กก1234"
         hx-get="/api/search" hx-trigger="keyup changed delay:300ms, search"
         hx-target="#results" autofocus>
  <label class="checkrow"><input type="checkbox" name="include_pending" value="true"
         hx-get="/api/search" hx-include="[name=q]" hx-target="#results">
         แสดงใบที่ยังไม่ผ่านการตรวจด้วย</label>
</div>
<div id="results"></div>
{% endblock %}
