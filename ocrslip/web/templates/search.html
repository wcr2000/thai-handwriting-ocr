{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>ค้นหาใบฝากรถ</h2>
  <p class="muted">พิมพ์ชื่อ เบอร์โทร หรือทะเบียนก็ได้ · สะกดผิดหรือเลขเพี้ยน 1-2 ตัวก็ยังหาเจอ</p>
  <input type="search" name="q" placeholder="เช่น สมชาย / 0800000000 / กก1234"
         hx-get="/api/search" hx-trigger="keyup changed delay:300ms, search"
         hx-target="#results" autofocus>
  <label><input type="checkbox" name="include_pending" value="true" form="opts"
         hx-get="/api/search" hx-include="[name=q]" hx-target="#results"> แสดงใบที่ยังไม่ผ่านการตรวจด้วย</label>
</div>
<div id="results"></div>
{% endblock %}
