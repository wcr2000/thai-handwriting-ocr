# Render Blueprint — https://render.com/docs/blueprint-spec
# Every secret is sync: false, meaning "fill this in via the Render Dashboard" — never stored in git
services:
  - type: web
    name: ocr-dhammakaya
    runtime: docker
    # standard = 1 CPU / 2 GB, matching real usage. Do not drop back to starter
    # (0.5 CPU / 512 MB): uploading 6 files at once peaks at ~576 MB and gets OOM-killed.
    plan: standard
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /static/app.css answers 200 without a DB connection and without a login
    healthCheckPath: /static/app.css
    autoDeployTrigger: commit
    # Run the migration before switching traffic every time. The whole of schema.sql is written to
    # be re-runnable (IF NOT EXISTS / CREATE OR REPLACE), so running it on every deploy is free of
    # side effects.
    #
    # This happened for real: code requiring the app_settings table was deployed before anybody
    # had run db init, so /in — the page drivers use — 500ed entirely, over nothing but a
    # forgotten step. With the migration here, a failing migration means the deploy never goes
    # live at all, which beats going live broken.
    preDeployCommand: python -m ocrslip.db init
    envVars:
      # --- OpenRouter ---
      - key: OPENROUTER_API_KEY
        sync: false
      # --- Postgres ---
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        sync: false
      # --- OCR ---
      - key: OCR_MODEL
        sync: false
      - key: CONFIDENCE_THRESHOLD
        sync: false
      - key: USD_THB
        sync: false
      # --- login ---
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: USER_USERNAME
        sync: false
      - key: USER_PASSWORD_HASH
        sync: false
      - key: APPROVE_USERNAME
        sync: false
      - key: APPROVE_PASSWORD_HASH
        sync: false
      # Render is already HTTPS, so set true to force a Secure cookie
      - key: COOKIE_SECURE
        sync: false
      # --- the self-service entry form (/in) ---
      # The passcode a staff member types to close the form. Unset disables /in entirely.
      - key: ENTRY_PASSWORD
        sync: false
      # The building and floor choices are only defaults. What is actually in use is editable on
      # the /settings page and takes effect immediately with no restart, so these two rarely need
      # touching after the initial setup.
      - key: ENTRY_BUILDINGS
        sync: false
      - key: ENTRY_FLOORS
        sync: false
