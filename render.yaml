# Render Blueprint — https://render.com/docs/blueprint-spec
# ค่าลับทุกตัวเป็น sync: false คือ "ให้ไปกรอกใน Render Dashboard" ไม่เก็บลง git
services:
  - type: web
    name: ocr-dhammakaya
    runtime: docker
    # standard = 1 CPU / 2 GB ตรงกับที่ใช้จริง — ห้ามลดกลับเป็น starter (0.5 CPU / 512 MB)
    # เพราะ upload 6 ไฟล์พร้อมกันใช้แรมพีค ~576 MB จะโดน OOM kill
    plan: standard
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /static/app.css ตอบ 200 โดยไม่ต้องต่อ DB และไม่ติด login
    healthCheckPath: /static/app.css
    autoDeployTrigger: commit
    # รัน migration ก่อนสลับ traffic ทุกครั้ง — schema.sql เขียนแบบรันซ้ำได้ทั้งไฟล์
    # (IF NOT EXISTS / CREATE OR REPLACE) จึงรันทุก deploy ได้ไม่มีผลข้างเคียง
    #
    # เคยเกิดขึ้นจริง: deploy โค้ดที่ต้องใช้ตาราง app_settings ขึ้นไปแล้ว แต่ยังไม่มีใคร
    # รัน db init ผลคือหน้า /in ที่ผู้มาจอดใช้ตอบ 500 ทั้งหน้า ทั้งที่เป็นแค่ขั้นตอน
    # ที่ลืมทำ ถ้า migration พัง deploy จะไม่ขึ้นเลย ซึ่งดีกว่าขึ้นไปแล้วหน้าแตก
    preDeployCommand: python -m ocrslip.db init
    envVars:
      # --- OpenRouter ---
      - key: OPENROUTER_API_KEY
        sync: false
      # --- Postgres ---
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        sync: false
      # --- OCR ---
      - key: OCR_MODEL
        sync: false
      - key: CONFIDENCE_THRESHOLD
        sync: false
      - key: USD_THB
        sync: false
      # --- ระบบล็อกอิน ---
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: USER_USERNAME
        sync: false
      - key: USER_PASSWORD_HASH
        sync: false
      - key: APPROVE_USERNAME
        sync: false
      - key: APPROVE_PASSWORD_HASH
        sync: false
      # Render เป็น HTTPS อยู่แล้ว — ตั้ง true เพื่อบังคับ Secure cookie
      - key: COOKIE_SECURE
        sync: false
      # --- ฟอร์มขาเข้าที่ผู้มาจอดกรอกเอง (/in) ---
      # รหัสที่เจ้าหน้าที่พิมพ์ปิดท้ายฟอร์ม ไม่ตั้ง = ปิดหน้า /in ไปเลย
      - key: ENTRY_PASSWORD
        sync: false
      # ตัวเลือกอาคาร/ชั้น เป็นแค่ "ค่าตั้งต้น" — ค่าที่ใช้จริงแก้ได้ที่หน้า /settings
      # และมีผลทันทีโดยไม่ต้องรีสตาร์ต สองตัวนี้จึงแทบไม่ต้องแตะหลังตั้งครั้งแรก
      - key: ENTRY_BUILDINGS
        sync: false
      - key: ENTRY_FLOORS
        sync: false
